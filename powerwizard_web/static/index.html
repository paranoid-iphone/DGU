<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerWizard Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
  <div class="header-left">
    <span class="logo">⚡ PowerWizard</span>
    <span id="mode-badge" class="mode-badge">—</span>
  </div>
  <div class="header-right">
    <span id="last-update" class="last-update">—</span>
    <span id="conn-indicator" class="conn-dot conn-unknown"></span>
  </div>
</header>

<main class="overview-grid" id="overview-grid">
  <div class="loading-placeholder">Загрузка...</div>
</main>

<!-- Drawer -->
<div id="drawer-overlay" class="drawer-overlay hidden"></div>
<aside id="drawer" class="drawer hidden">
  <button id="drawer-close" class="drawer-close" aria-label="Закрыть">✕</button>
  <div id="drawer-content" class="drawer-content"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
